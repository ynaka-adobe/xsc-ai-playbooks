name: Bump plugin versions

# Server-side backstop for .githooks/pre-commit: on every push to main, bump the
# patch version of any plugin whose files changed without a version bump, and
# regenerate the /docs catalog. Pushes made with GITHUB_TOKEN don't retrigger
# workflows, so this can't loop.
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "scripts/gen-catalog.mjs"

permissions:
  contents: write

concurrency:
  group: bump-versions
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump changed plugins
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -e
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE=$(git rev-parse HEAD~1)
          fi
          changed=$(git diff --name-only "$BEFORE" HEAD)

          for mf in plugins/*/.claude-plugin/plugin.json; do
            [ -f "$mf" ] || continue
            pdir=$(dirname "$(dirname "$mf")")
            printf '%s\n' "$changed" | grep -v "^$mf$" | grep -q "^$pdir/" || continue
            if git diff "$BEFORE" HEAD -- "$mf" | grep -qE '^[-+][[:space:]]*"version"'; then
              echo "$pdir: version already bumped in this push"
              continue
            fi
            cur=$(node -p "require('./$mf').version")
            new=$(node -p "const [a,b,c]='$cur'.split('.').map(Number); [a,b,c+1].join('.')")
            sed -i "s/\"version\"[[:space:]]*:[[:space:]]*\"$cur\"/\"version\": \"$new\"/" "$mf"
            echo "$pdir: $cur -> $new"
          done

      - name: Regenerate /docs catalog
        run: node scripts/gen-catalog.mjs

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain plugins docs)" ]; then
            echo "Nothing to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add plugins docs
          git commit -m "Bump plugin versions and regenerate /docs [skip ci]"
          git push
